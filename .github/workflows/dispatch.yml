name: Dispatch

on:
  repository_dispatch:
    types: [fcx-trigger]

jobs:
  dispatch:
    name: Dispatch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run dispatch handler
        run: echo "Dispatch event: ${{ github.event.client_payload.action }}"
