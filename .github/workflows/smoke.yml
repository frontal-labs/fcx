name: Smoke

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build all packages
        run: bun run build

      - name: Version check
        run: bunx tsx cli/src/main.ts --version

      - name: Status check
        run: bunx tsx cli/src/main.ts status

      - name: Doctor check
        run: bunx tsx cli/src/main.ts doctor
