# LoRA config for the fix-diagnostic fine-tune (plan 13.3). Read by training/run.sh with mlx_lm.lora --config.
# Base: Qwen/Qwen2.5-1.5B-Instruct, Apache-2.0 (model card, checked 2026-11-01). Data: training/data/fix-diagnostic.
model: "Qwen/Qwen2.5-1.5B-Instruct"
train: true
fine_tune_type: lora
data: "training/data/fix-diagnostic"
adapter_path: "training/runs/fix-diagnostic/adapters"
seed: 0

# Adapter placement: all 28 layers, attention and MLP projections only.
num_layers: 28
lora_parameters:
  rank: 8
  scale: 20.0
  dropout: 0.0
  keys:
    - self_attn.q_proj
    - self_attn.k_proj
    - self_attn.v_proj
    - self_attn.o_proj
    - mlp.gate_proj
    - mlp.up_proj
    - mlp.down_proj

# Optimization. Fixed in advance; no checkpoint is picked by test results.
batch_size: 2
iters: 300
learning_rate: 1.0e-4
max_seq_length: 2048
grad_checkpoint: true
mask_prompt: true
val_batches: 25
steps_per_report: 10
steps_per_eval: 100
save_every: 100
